<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Exploding Kittens Registratie </title>
    <link rel="stylesheet" href="css/register.css" />
    <link href='https://fonts.googleapis.com/css?family=Abel' rel='stylesheet'>
    <script src="js/register.js" defer></script>
    
</head>
<body>

<aside>
        <div class="logo">
            <img src="./assets/cat-svgrepo-com.svg" alt="logo">
        </div>
        <nav class="sidebar-menu">
            <a id="welcome" href="index.html">WELCOME</a>
            <a id="register" href="register.html">REGISTER</a>
            <a id="login" href="login.html">LOGIN</a>
        </nav>
    </aside>

<main>
    <header><h1>registeer</h1></header>
    <section class="content">
        <form id="registerForm" class="register-form" novalidate>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
            <p class="error" id="emailError"></p>

            <label for="username">Gebruikersnaam</label>
            <input type="text" id="username" name="username" required />
            <p class="error" id="usernameError"></p>

            <label for="password">Wachtwoord</label>
            <input type="password" id="password" name="password" minlength="6" required />
            <p class="error" id="passwordError"></p>

            <label for="confirmPassword"> Bevestig Wachtwoord</label>
            <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" required />
            <p class="error" id="confirmPasswordError"></p>

            <label for="birthDate"> Geboortedatum </label>
            <input type="date" id="birthDate" name="birthDate" />
            <p class="error" id="birthDateError"></p>

            <p class="backend-error" id="backendError"></p>

            <button id="registerButton" type="submit">REGISTREER</button>

        </form>
    </section>
</main>
</body>
</html>
