<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8" />
    <title>Exploding Kittens Lobby </title>
    <link rel="stylesheet" href="css/lobby.css" />
    <link rel="stylesheet" href="css/lobby-browser.css" />
    <link rel="stylesheet" href="css/lobby-table.css" />
    <link rel="stylesheet" href="css/lobby-newTable.css" />
    <link href='https://fonts.googleapis.com/css?family=Abel' rel='stylesheet'>
    <script type="module" src="js/lobby.js"></script>
    <script src="js/lobby-browser.js"></script>
    <script src="js/lobby-newTable.js"></script>
    <script src="js/lobby-table.js"></script>

</head>
<body>
<aside>
    <div class="logo">
        <img src="./assets/cat-svgrepo-com.svg" alt="logo">
    </div>
    <nav class="sidebar-menu">
        <a id="logout" href="index.html">LOG OUT</a>
        <a id="lobby" href="lobby.html">lobby</a>
        <a id="nieuweTafel">nieuwe tafel</a>
        <a id="verlaatTafel">verlaat tafel</a>
    </nav>
</aside>
<main>
    <header>
        <h1 id="headerTitle"></h1>
        <h2 id="headerIntro"></h2>
    </header>
    <section class="newTable">
        <form id="newTableForm" class="newTable-form">
            <label for="newTableForm">TAFEL NAAM</label>
            <input type="text" id="newTableName" name="newTableName" required />
            <p class="error" id="newTableNameError"></p>

            <label for="numberOfPlayers">Aantal Spelers</label>
            <input type="number" id="numberOfPlayers" name="numberOfPlayers" max="5" required />
            <p class="error" id="numberOfPlayersError"></p>

            <label for="numberOfAIPlayers">Aantal AI Spelers</label>
            <input type="number" id="numberOfAIPlayers" name="numberOfAIPlayers" max="4" required />
            <p class="error" id="numberOfAIPlayersError"></p>

            <p class="backend-error" id="backendError"></p>

            <button id="createNewTableButton" type="submit">MAAK NIEUWE TAFEL</button>
        </form>
    </section>

    <section class="lobby-browser">
            <table class="table-list">
                <thead>
                    <tr>
                        <th>Game id</th>
                        <th>Aanwezig</th>
                        <th>Totaal</th>
                        <th>Vrij</th>
                    </tr>
                </thead>
                <tbody class="table-list-output">
                    <tr class="table-list-placeholder">
                        <td>Gelieve de tafels te fliteren</td>
                    </tr>
                </tbody>
            </table>
            
            <div class="filter">
                <table class="filterForm">
                    <thead>
                        <tr>
                            <th><button class="head" id="filter">filter</button></th>
                            <th><button class="head" id="reset">reset filter</button></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Aantal spelers</td>
                            <td>
                                <select id="spelers" name="spelers" aria-label="Aantal spelers">
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>Aantal AI</td>
                            <td>
                                <select id="IA" name="IA" aria-label="Aantal AI spelers">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                </select>
                            </td>
                        </tr>
                    </tbody>
                
                </table>

                <form id="filterForm">
                    <button type="submit">testButtonForTable</button>
                </form>
                <button class="go-to-table" >Ga naar tafel</button>
            </div>
            <p class="backend-error" id="backendError"></p>
    </section>

    <section class="lobbyTable">
        <section class="lobbyTable-form">
            <table class="playerTables">
                <thead>
                <tr>
                    <th>Speler</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>1. My kitten is the best</td>
                </tr>
                <tr>
                    <td>2. I love Dogs</td>
                </tr>
                <tr>
                    <td>3. My everything</td>
                </tr>
                <tr>
                    <td>4. Wachten op een nieuwe speler</td>
                </tr>
                <tr>
                    <td>5. Wachten op een nieuwe speler</td>
                </tr>


                </tbody>
            </table>
            <div class="lobbyTeller-wrapper">
                <table class="lobbyTeller">
                    <thead>
                    <tr>
                        <th colspan="2">Lobby teller</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>Aantal spelers</td>
                        <td>2/5</td>
                    </tr>
                    <tr>
                        <td>Aantal AI</td>
                        <td>2</td>
                    </tr>
                    </tbody>
                </table>

                <button class="start-table" >Start tafel</button>
            </div>

        </section>
    </section>

</main>
</body>
</html>
