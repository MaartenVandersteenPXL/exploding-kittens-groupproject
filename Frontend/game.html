<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Exploding Kittens - Game</title>
    <link rel="stylesheet" href="css/game.css"/>
    <script type="module" src="js/game.js"></script>
    <link href='https://fonts.googleapis.com/css?family=Abel' rel='stylesheet'>
</head>
<body>

<aside>
    <div class="logo">
        <img src="./assets/cat-svgrepo-com.svg" alt="logo">
    </div>
    <nav class="sidebar-menu">
        <a id="logout" href="index.html">LOG OUT</a>
        <a id="XXX" href="">XXX</a>
        <a id="XXX1" href="">XXX</a>
        <a id="XXX2" href="">XXX</a>
    </nav>
</aside>

<main>
    <header>
        <h1 id="headerTitle"></h1>
        <h2 id="headerIntro"></h2>
    </header>

    <!-- Speelveld Cirkel -->
    <section class="table-area">
        <div class="circle">
            <!-- Spelers rondom de tafel -->
            <div class="opponent p2"><span>PLAYER 2</span>
                <div class="nr-cards-opponents">8</div>
            </div>
            <div class="opponent p3"><span>PLAYER 3</span>
                <div class="nr-cards-opponents">8</div>
            </div>
            <div class="opponent p1"><span>PLAYER 1</span>
                <div class="nr-cards-opponents">8</div>
            </div>
            <div class="opponent p4"><span>PLAYER 4</span>
                <div class="nr-cards-opponents">8</div>
            </div>
            <!-- Kaarten op tafel -->
            <div class="discard-pile" id="discardPile"><span>AFLEGSTAPEL</span>
                <div class="discard-card-value" id="lastDiscardedCard">LEEG</div>
            </div>
            <div class="deck">
                <div class="nr-cards-left-deck">10</div>
                <p>Kaart<br>Deck</p>
            </div>
        </div>
    </section>

    <!-- Dashboard onderaan -->
    <section class="hand-area">
        <div class="hand-container" id="userCardHand">
            <!-- inject cards -->
        </div>
        <div class="hand-controls">
            <div class="game-message">
                <p id="statusMessage"></p>
                <p class="backend-error" id="backendErrorPlayersTable"></p>
            </div>
            <p class="backend-error" id="backendError"></p>
            <button id="playActionBtn" class="play-btn">SPEEL</button>
            <button id="drawActionBtn" class="draw-btn">NEEM KAART</button>
            <!-- NEEDS DRAW BUTTION -->
            <div id="nopePrompt" style="display:none">
                <button id="nopeBtn" class="nope-btn">NOPE!</button>
                <button id="passBtn" class="pass-btn">PASS</button>
            </div>
        </div>
    </section>
</main>

</body>
</html>
